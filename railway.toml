## Railway deploy config for the Colyseus server (see docs/DEPLOYMENT.md).
## The client is deployed separately to Vercel; Railway only runs the WebSocket server.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "yarn start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
